<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping List</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #cb9ea4, #97979a);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}


.container {
    background: rgb(205, 178, 178);
    padding: 20px;
    border-radius: 10px;
    width: 300px;
    text-align: center;
}


h1 {
    margin-bottom: 15px;
}


input {
    width: 80%;
    padding: 8px;
    margin-bottom: 10px;
}


ul {
    list-style: none;
    padding: 0;
}

li {
    padding: 10px;
    background: #eee;
    margin-top: 5px;
    border-radius: 5px;
    transition: 0.3s;
}


li:hover {
    background: #ddd;
}


input[type="checkbox"] {
    margin-right: 10px;
}
</style>

</head>
<body>

<div class="container">
    <h1>Shopping List</h1>


    <ul>
        <li><input type="checkbox"> ring</li>
        <li><input type="checkbox"> necklace</li>
        <li><input type="checkbox"> bracelet</li>
        <li><input type="checkbox"> anklet</li>
    </ul>

</div>

</body>
</html>
